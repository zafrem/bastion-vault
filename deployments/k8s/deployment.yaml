---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bastion-vault
  namespace: bastion
  labels:
    app: bastion-vault
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bastion-vault
  template:
    metadata:
      labels:
        app: bastion-vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/v1/metrics"
    spec:
      serviceAccountName: bastion-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: vault
          image: bastion-vault:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: VAULT_KMS_LOCAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: bastion-vault-secrets
                  key: master-key
            - name: VAULT_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: bastion-vault-secrets
                  key: database-dsn
            - name: VAULT_CACHE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: bastion-vault-config
                  key: redis-address
            - name: VAULT_LOG_LEVEL
              value: "info"
            - name: VAULT_LOG_FORMAT
              value: "json"
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/vault
            - name: policies
              mountPath: /etc/vault/policies
            - name: audit-logs
              mountPath: /audit-logs
            - name: keys
              mountPath: /keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: bastion-vault-config
        - name: policies
          configMap:
            name: bastion-vault-policies
        - name: audit-logs
          persistentVolumeClaim:
            claimName: vault-audit-logs
        - name: keys
          secret:
            secretName: bastion-vault-keys

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bastion-vault-hpa
  namespace: bastion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bastion-vault
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: v1
kind: Service
metadata:
  name: bastion-vault
  namespace: bastion
spec:
  selector:
    app: bastion-vault
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bastion-vault
  namespace: bastion
